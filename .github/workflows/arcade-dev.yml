name: Arcade Mode development
on:
  push:
    branches: [arcade-mode, main, 'arcade-stage-*', 'ci-optimization/arcade']
  workflow_dispatch:
    inputs:
      full_integration:
        description: Complete integration for an exact-source candidate
        type: boolean
        default: true
      cold_cache:
        description: Bypass Cargo caches for a measured cold run
        type: boolean
        default: false
      benchmark:
        description: Run every gate and package, but do not publish or update the channel
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/arcade-validation.yml
    with:
      full_integration: ${{ inputs.full_integration == true || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arcade-mode' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full integration]') || contains(github.event.head_commit.message, '[release candidate]') }}
      cold_cache: ${{ inputs.cold_cache == true }}
      benchmark: ${{ inputs.benchmark == true }}

  publish:
    needs: [validation]
    if: needs.validation.outputs.full == 'true' && github.repository == 'notPho-Real/ReSkate' && github.ref == 'refs/heads/arcade-mode' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.benchmark)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: arcade-deck-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReSkate-Arcade-Deck-${{ github.sha }}
          path: artifacts
      - name: Publish tested Deck update
        if: github.ref == 'refs/heads/arcade-mode'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="arcade-build-$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" artifacts/Install-ReSkate-Arcade.desktop artifacts/channel.json \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Arcade Mode tested build ${GITHUB_SHA:0:7}" \
              --notes "Windows x64 DLL/model, Linux installer/updater and hosted macOS Arcade Lab simulations passed. Hardware acceptance is separate; these gates do not deploy to any Deck."
          else
            # A retry may only reuse byte-identical published artifacts.
            mkdir -p artifacts/existing
            gh release download "$tag" --pattern Install-ReSkate-Arcade.desktop --pattern channel.json --dir artifacts/existing
            cmp artifacts/channel.json artifacts/existing/channel.json
            cmp artifacts/Install-ReSkate-Arcade.desktop artifacts/existing/Install-ReSkate-Arcade.desktop
          fi
          # An older build finishing late must not replace the current update channel.
          head=$(gh api "repos/$GH_REPO/git/ref/heads/arcade-mode" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Newer arcade-mode commit exists; leaving the update channel unchanged."
            exit 0
          fi
          if ! gh release view arcade-deck-latest >/dev/null 2>&1; then
            gh release create arcade-deck-latest --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Arcade Mode — install once, update on Deck" \
              --notes "Download Install-ReSkate-Arcade.desktop once. It installs Update Arcade Mode and Restore Stock ReSkate buttons. Future updates fetch only tested arcade-mode builds."
          fi
          # Publish the pointer last, after the immutable build and installer are available.
          gh release upload arcade-deck-latest artifacts/Install-ReSkate-Arcade.desktop --clobber
          gh release upload arcade-deck-latest artifacts/channel.json --clobber
