name: Arcade Mode development
on:
  push:
    branches: [arcade-mode, 'arcade-stage-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'notPho-Real/ReSkate' && (github.ref == 'refs/heads/arcade-mode' || startsWith(github.ref, 'refs/heads/arcade-stage-'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Fetch native dependencies required at configure time
        run: cargo fetch --locked --manifest-path SpotifyHelper/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Configure
        run: cmake --preset vs2022-x64 -DDINGOSDK_BUILD_ARCADE_MODE_TESTS=ON -DDINGOSDK_BUILD_LAUNCHER_TESTS=ON
      - name: Build
        run: cmake --build --preset release --parallel 4 --target dingosdk_runtime dingosdk_launcher dingosdk_depot_output_tests dingosdk_arcade_mode_tests dingosdk_arcade_native_score_tests dingosdk_arcade_grind_observer_tests
      - name: Test
        run: ctest --test-dir build/vs2022-x64 -C Release -R "^(arcade_(mode|native_score(_replay)?|grind_observer)|launcher_depot_output)$" --output-on-failure
      - name: Stage development DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/arcade-dev -Force | Out-Null
          Copy-Item build/vs2022-x64/Release/ReSkate.dll artifacts/arcade-dev/ReSkate.dll
          $hash = (Get-FileHash artifacts/arcade-dev/ReSkate.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ReSkate.dll" | Set-Content artifacts/arcade-dev/ReSkate.dll.sha256 -Encoding ascii
          $env:GITHUB_SHA | Set-Content artifacts/arcade-dev/commit.txt -Encoding ascii
      - name: Upload development DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReSkate-arcade-dev-${{ github.sha }}
          path: |
            artifacts/arcade-dev/ReSkate.dll
            artifacts/arcade-dev/ReSkate.dll.sha256
            artifacts/arcade-dev/commit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Stage tested recovery launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/arcade-launcher -Force | Out-Null
          Copy-Item build/vs2022-x64/Release/ReSkateLauncher.exe artifacts/arcade-launcher/ReSkateLauncher.exe
          $hash = (Get-FileHash artifacts/arcade-launcher/ReSkateLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ReSkateLauncher.exe" | Set-Content artifacts/arcade-launcher/ReSkateLauncher.exe.sha256 -Encoding ascii
          $env:GITHUB_SHA | Set-Content artifacts/arcade-launcher/commit.txt -Encoding ascii
      - name: Upload tested recovery launcher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReSkate-arcade-launcher-${{ github.sha }}
          path: artifacts/arcade-launcher/
          if-no-files-found: error
          retention-days: 30

  linux-tests:
    if: github.repository == 'notPho-Real/ReSkate' && (github.ref == 'refs/heads/arcade-mode' || startsWith(github.ref, 'refs/heads/arcade-stage-'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Deck, lab and bounded trick-batch simulations
        run: python3 contrib/arcade-mode/lab/controller.py self-test
      - name: Neutral repository naming
        run: |
          git log -1 --format=%B > "$RUNNER_TEMP/arcade-commit-message.txt"
          python3 contrib/arcade-mode/lab/naming_guard.py --message-file "$RUNNER_TEMP/arcade-commit-message.txt"
      - name: Shell syntax
        run: find contrib/arcade-mode -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -n1 bash -n

  macos-lab:
    if: github.repository == 'notPho-Real/ReSkate' && (github.ref == 'refs/heads/arcade-mode' || startsWith(github.ref, 'refs/heads/arcade-stage-'))
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Mac lab, trick-batch cleanup, bootstrap and fake Deck tests (no hardware)
        run: python3 contrib/arcade-mode/lab/controller.py self-test
      - name: Python and shell syntax
        run: |
          python3 -m compileall -q contrib/arcade-mode
          find contrib/arcade-mode -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -n1 bash -n

  deck:
    needs: [build, linux-tests, macos-lab]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test installer and updater
        run: python3 -m unittest discover -s contrib/arcade-mode -p 'test_*.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReSkate-arcade-dev-${{ github.sha }}
          path: artifacts/runtime
      - name: Verify and package this tested build
        run: |
          cd artifacts/runtime
          sha256sum -c ReSkate.dll.sha256
          test "$(tr -d '\r\n' < commit.txt)" = "$GITHUB_SHA"
          cd ../..
          python3 contrib/arcade-mode/package_deck_installer.py artifacts/runtime/ReSkate.dll "$GITHUB_SHA" artifacts/Install-ReSkate-Arcade.desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReSkate-Arcade-Deck-${{ github.sha }}
          path: |
            artifacts/Install-ReSkate-Arcade.desktop
            artifacts/channel.json
          if-no-files-found: error

  publish:
    needs: [build, linux-tests, macos-lab, deck]
    if: github.repository == 'notPho-Real/ReSkate' && github.ref == 'refs/heads/arcade-mode' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: arcade-deck-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReSkate-Arcade-Deck-${{ github.sha }}
          path: artifacts
      - name: Publish tested Deck update
        if: github.ref == 'refs/heads/arcade-mode'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="arcade-build-$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" artifacts/Install-ReSkate-Arcade.desktop artifacts/channel.json \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Arcade Mode tested build ${GITHUB_SHA:0:7}" \
              --notes "Windows x64 DLL/model, Linux installer/updater and hosted macOS Arcade Lab simulations passed. Hardware acceptance is separate; these gates do not deploy to any Deck."
          else
            # A retry may only reuse byte-identical published artifacts.
            mkdir -p artifacts/existing
            gh release download "$tag" --pattern Install-ReSkate-Arcade.desktop --pattern channel.json --dir artifacts/existing
            cmp artifacts/channel.json artifacts/existing/channel.json
            cmp artifacts/Install-ReSkate-Arcade.desktop artifacts/existing/Install-ReSkate-Arcade.desktop
          fi
          # An older build finishing late must not replace the current update channel.
          head=$(gh api "repos/$GH_REPO/git/ref/heads/arcade-mode" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Newer arcade-mode commit exists; leaving the update channel unchanged."
            exit 0
          fi
          if ! gh release view arcade-deck-latest >/dev/null 2>&1; then
            gh release create arcade-deck-latest --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Arcade Mode — install once, update on Deck" \
              --notes "Download Install-ReSkate-Arcade.desktop once. It installs Update Arcade Mode and Restore Stock ReSkate buttons. Future updates fetch only tested arcade-mode builds."
          fi
          # Publish the pointer last, after the immutable build and installer are available.
          gh release upload arcade-deck-latest artifacts/Install-ReSkate-Arcade.desktop --clobber
          gh release upload arcade-deck-latest artifacts/channel.json --clobber
