name: Arcade upstream integration
on:
  pull_request:
    branches: [main, arcade-mode, 'arcade-stage-*']
  push:
    tags: ['arcade-rc-*', 'arcade-milestone-*']
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Bypass caches for reproducibility measurement
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  complete:
    permissions:
      contents: write
    uses: ./.github/workflows/arcade-dev.yml
    with:
      full_integration: true
      benchmark: true
      cold_cache: ${{ inputs.cold_cache == true }}
