name: Arcade Mode targeted tests
on:
  workflow_call:
    inputs:
      full_integration:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-targeted-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]')) && 'development' || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]') }}
jobs:
  targeted:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Configure standalone existing tests
        run: cmake -S contrib/arcade-mode/ci/targeted -B build/arcade-fast -G "Visual Studio 17 2022" -A x64
      - name: Build targeted tests
        run: cmake --build build/arcade-fast --config Release --parallel 4
      - name: Run targeted tests
        run: ctest --test-dir build/arcade-fast -C Release --output-on-failure --no-tests=error
