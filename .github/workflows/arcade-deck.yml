name: Arcade Mode Steam Deck tests
on:
  push:
    branches: [arcade-mode]
    paths:
      - 'contrib/arcade-mode/**'
      - '.github/workflows/arcade-deck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    if: github.repository == 'notPho-Real/ReSkate' && github.ref == 'refs/heads/arcade-mode'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test installer and update channel
        run: python3 -m unittest discover -s contrib/arcade-mode -p 'test_*.py' -v
