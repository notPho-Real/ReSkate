name: Arcade validation graph
on:
  workflow_call:
    inputs:
      full_integration:
        type: boolean
        default: true
      cold_cache:
        type: boolean
        default: false
      benchmark:
        type: boolean
        default: true
    outputs:
      full:
        description: Whether this run performed complete integration
        value: ${{ jobs.policy.outputs.full }}
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.level.outputs.full }}
    steps:
      - id: level
        env:
          FULL: ${{ inputs.full_integration == true || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/arcade-mode' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full integration]') || contains(github.event.head_commit.message, '[release candidate]') }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"

  targeted:
    uses: ./.github/workflows/arcade-fast.yml
    with:
      full_integration: ${{ inputs.full_integration == true }}

  windows-tests:
    if: github.repository == 'notPho-Real/ReSkate' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-test-diagnostic]'))
    concurrency:
      group: ${{ github.workflow }}-windows-tests-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]')) && 'development' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]') }}
    runs-on: windows-2022
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/SpotifyHelper/target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Restore Spotify dependencies and build cache
        uses: ./.github/actions/spotify-cache
        with:
          build-cache: 'false'
          cold: ${{ inputs.cold_cache == true && 'true' || 'false' }}
      - name: Fetch native dependencies required at configure time
        run: cargo fetch --locked --manifest-path SpotifyHelper/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Configure
        run: cmake --preset vs2022-x64 -DDINGOSDK_BUILD_TESTS=ON -DDINGOSDK_BUILD_ARCADE_MODE_TESTS=ON -DDINGOSDK_BUILD_LAUNCHER_TESTS=ON -DDINGOSDK_BUILD_ARCADE_SCORE_ASSET_TOOLS=ON -DDINGOSDK_BUILD_PARK_EDITOR_TESTS=ON
      # Independent runner/build tree: never race MSBuild on the runtime tree.
      # This complete test gate remains required by packaging and publishing.
      - name: Compile Windows test preflight
        run: cmake --build --preset release --parallel 4 --target dingosdk_arcade_footplant_tests dingosdk_arcade_ground_grab_tests dingosdk_arcade_fingerflip_tests dingosdk_arcade_held_flip_tests dingosdk_arcade_native_orientation_tests dingosdk_arcade_manual_throw_tests dingosdk_arcade_native_grab_tests dingosdk_arcade_runtime_reset_tests dingosdk_profile_preference_snapshot_tests dingosdk_arcade_settings_snapshot_tests dingosdk_child_identity_tests dingosdk_rotating_log_tests dingosdk_arcade_camera_input_tests dingosdk_arcade_camera_diagnostics_tests dingosdk_arcade_ground_motion_step_tests dingosdk_arcade_ground_writer_tests dingosdk_camera_observer_tests dingosdk_depot_output_tests dingosdk_arcade_mode_tests dingosdk_arcade_balance_hud_publication_tests dingosdk_arcade_native_score_tests dingosdk_arcade_grind_observer_tests dingosdk_arcade_grind_transition_lifetime_tests dingosdk_arcade_grind_change_tests dingosdk_arcade_rail_pop_tests dingosdk_arcade_fixture_geometry_tests dingosdk_arcade_fixture_trajectory_tests dingosdk_arcade_input_telemetry_tests dingosdk_arcade_input_contract_tests dingosdk_arcade_input_session_tests dingosdk_arcade_manual_input_tests dingosdk_arcade_neutral_flip_release_tests dingosdk_arcade_air_motion_proof_tests dingosdk_arcade_native_spin_integration_tests dingosdk_arcade_launch_descriptor_tests dingosdk_arcade_manual_balance_entry_tests dingosdk_arcade_manual_reservation_current dingosdk_arcade_controller_route_tests dingosdk_arcade_manual_observation_tests dingosdk_arcade_manual_history_tests dingosdk_arcade_manual_step_tests dingosdk_arcade_manual_lifecycle_tests dingosdk_arcade_manual_lifecycle_composition_tests dingosdk_arcade_manual_acquisition_boundary_tests dingosdk_park_editor_transaction_tests dingosdk_arcade_score_asset_tests
      # Separate unresolved parity check: arcade_input_manual_differential.
      - name: Run Windows test preflight
        run: ctest --test-dir build/vs2022-x64 -C Release -R "^(profile_preference_snapshot|arcade_(runtime_reset(_rollback_(persist|initial_load|expiry|owner|restore_mode|cleanup_scope))?|settings_snapshot(_source)?|camera_input|camera_diagnostics|ground_motion_step|ground_writer(_source)?|mode|native_score(_replay)?|grind_observer|grind_transition_lifetime|grind_change|rail_pop|fixture_geometry|fixture_trajectory|input_telemetry|input_contract|input_session|balance_hud_publication|controller_route|manual_input|manual_throw|neutral_flip_release|native_grab|footplant|ground_grab|fingerflip|held_flip|native_orientation|air_motion_proof|native_spin_integration|launch_descriptor|manual_balance_entry|manual_reservation(_.*)?|manual_observation|manual_history|manual_step|manual_lifecycle(_.*)?|manual_acquisition_boundary|score_assets)|child_identity|rotating_log(_startup_rollback)?|park_editor_transactions|launcher_depot_output|camera_observer_recovery)$" --output-on-failure
      - name: Check bounded session records
        run: python contrib/arcade-mode/test_session_records.py
      - name: Check optional asset regeneration
        run: python contrib/arcade-mode/test_ci_build.py

  build:
    if: github.repository == 'notPho-Real/ReSkate' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-test-diagnostic]'))
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]')) && 'development' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]') }}
    needs: [policy]
    timeout-minutes: 60
    runs-on: windows-2022
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/SpotifyHelper/target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Restore Spotify dependencies and build cache
        uses: ./.github/actions/spotify-cache
        with:
          build-cache: 'true'
          cold: ${{ inputs.cold_cache == true && 'true' || 'false' }}
      - name: Fetch native dependencies required at configure time
        run: cargo fetch --locked --manifest-path SpotifyHelper/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Configure
        env:
          FULL: ${{ needs.policy.outputs.full }}
        run: |
          $options = @('-DDINGOSDK_BUILD_TESTS=ON', '-DDINGOSDK_BUILD_ARCADE_MODE_TESTS=OFF', '-DDINGOSDK_BUILD_LAUNCHER_TESTS=ON', '-DDINGOSDK_BUILD_ARCADE_SCORE_ASSET_TOOLS=ON', '-DDINGOSDK_BUILD_PARK_EDITOR_TESTS=ON')
          if ($env:FULL -eq 'true') {
            $options += @('-DDINGOSDK_BUILD_TRAINER_TESTS=ON', '-DDINGOSDK_BUILD_MULTIPLAYER_TESTS=ON', '-DDINGOSDK_BUILD_PLUGIN_TESTS=ON', '-DDINGOSDK_BUILD_CRASH_REPORT_TESTS=ON')
          }
          cmake --preset vs2022-x64 @options
      - name: Build crash reporter regression before the full runtime
        if: needs.policy.outputs.full == 'true'
        run: cmake --build --preset release --parallel 4 --target dingosdk_crash_report_tests
      - name: Check crash capture and post-exit metadata
        if: needs.policy.outputs.full == 'true'
        run: ctest --test-dir build/vs2022-x64 -C Release -R '^crash_report$' --repeat until-fail:3 --output-on-failure --no-tests=error
      - name: Build runtime and release tools
        if: needs.policy.outputs.full != 'true'
        run: cmake --build --preset release --parallel 4 --target dingosdk_runtime dingosdk_launcher dingosdk_arcade_score_assets
      - name: Build all configured targets with upstream warning policy
        if: needs.policy.outputs.full == 'true'
        run: cmake --build --preset release --parallel 4
      - name: Run complete upstream integration tests
        if: needs.policy.outputs.full == 'true'
        # Existing real-game-data exclusion; Arcade composition remains required
        # in windows-tests and targeted on independent runners.
        run: ctest --test-dir build/vs2022-x64 -C Release -E '^trainer_tuning_names$' --output-on-failure --no-tests=error --output-junit integration-results.xml
      - name: Preserve complete test results
        if: always() && needs.policy.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-windows-tests-${{ github.sha }}
          path: |
            build/vs2022-x64/integration-results.xml
            build/vs2022-x64/Testing/Temporary/
          if-no-files-found: warn
      - name: Stage tested scoring metadata inspector
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/arcade-score-assets -Force | Out-Null
          Copy-Item build/vs2022-x64/Release/dingosdk_arcade_score_assets.exe artifacts/arcade-score-assets/
          $hash = (Get-FileHash artifacts/arcade-score-assets/dingosdk_arcade_score_assets.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dingosdk_arcade_score_assets.exe" | Set-Content artifacts/arcade-score-assets/sha256.txt -Encoding ascii
          $env:GITHUB_SHA | Set-Content artifacts/arcade-score-assets/commit.txt -Encoding ascii
      - name: Upload tested scoring metadata inspector
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReSkate-arcade-score-assets-${{ github.sha }}
          path: artifacts/arcade-score-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Stage development DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/arcade-dev -Force | Out-Null
          Copy-Item build/vs2022-x64/Release/ReSkate.dll artifacts/arcade-dev/ReSkate.dll
          $hash = (Get-FileHash artifacts/arcade-dev/ReSkate.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ReSkate.dll" | Set-Content artifacts/arcade-dev/ReSkate.dll.sha256 -Encoding ascii
          $env:GITHUB_SHA | Set-Content artifacts/arcade-dev/commit.txt -Encoding ascii
      - name: Record runtime provenance
        env:
          FULL: ${{ needs.policy.outputs.full }}
        run: python contrib/arcade-mode/ci/provenance.py create artifacts/arcade-dev
      - name: Upload development DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReSkate-arcade-dev-${{ github.sha }}
          path: |
            artifacts/arcade-dev/ReSkate.dll
            artifacts/arcade-dev/ReSkate.dll.sha256
            artifacts/arcade-dev/commit.txt
            artifacts/arcade-dev/provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Stage tested recovery launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/arcade-launcher -Force | Out-Null
          Copy-Item build/vs2022-x64/Release/ReSkateLauncher.exe artifacts/arcade-launcher/ReSkateLauncher.exe
          $hash = (Get-FileHash artifacts/arcade-launcher/ReSkateLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ReSkateLauncher.exe" | Set-Content artifacts/arcade-launcher/ReSkateLauncher.exe.sha256 -Encoding ascii
          $env:GITHUB_SHA | Set-Content artifacts/arcade-launcher/commit.txt -Encoding ascii
      - name: Upload tested recovery launcher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReSkate-arcade-launcher-${{ github.sha }}
          path: artifacts/arcade-launcher/
          if-no-files-found: error
          retention-days: 30


  windows-test-diagnostic:
    if: github.repository == 'notPho-Real/ReSkate' && github.ref == 'refs/heads/arcade-mode' && github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-test-diagnostic]')
    runs-on: windows-2022
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          path: diagnostic-tools
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: 29301b36a27f6deec969415136464a319d43271d
          path: source
      - name: Build only frozen Release test and capture one debugger execution
        shell: pwsh
        timeout-minutes: 10
        run: ./diagnostic-tools/contrib/arcade-mode/lab/windows_test_diagnostic.ps1
      - name: Upload sanitized diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcade-windows-test-diagnostic-${{ github.sha }}
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 3

  linux-tests:
    if: github.repository == 'notPho-Real/ReSkate' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-test-diagnostic]'))
    concurrency:
      group: ${{ github.workflow }}-linux-tests-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]')) && 'development' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Native input and animation-ownership contract regressions (no hardware)
        run: |
          for suite in input_session neutral_flip_release air_motion_proof action_dispatch native_grab manual_throw control_state; do
            c++ -std=c++20 -O2 -I. "Extension/ArcadeMode/Test/arcade_${suite}_tests.cpp" -o "$RUNNER_TEMP/arcade_${suite}_tests"
            "$RUNNER_TEMP/arcade_${suite}_tests"
          done
      - name: Deck, lab and bounded trick-batch simulations
        run: python3 contrib/arcade-mode/lab/controller.py self-test
      - name: Validate CI scheduling, failure gates and artifact provenance
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 contrib/arcade-mode/ci/test_policy.py -v
      - name: Neutral repository naming
        run: |
          git log -1 --format=%B > "$RUNNER_TEMP/arcade-commit-message.txt"
          python3 contrib/arcade-mode/lab/naming_guard.py --message-file "$RUNNER_TEMP/arcade-commit-message.txt"
      - name: Shell syntax
        run: find contrib/arcade-mode -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -n1 bash -n

  macos-lab:
    if: github.repository == 'notPho-Real/ReSkate' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-test-diagnostic]'))
    concurrency:
      group: ${{ github.workflow }}-macos-lab-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]')) && 'development' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arcade-stage-') || github.ref == 'refs/heads/ci-optimization/arcade') && !inputs.full_integration && !contains(github.event.head_commit.message, '[full integration]') && !contains(github.event.head_commit.message, '[release candidate]') }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Native input and animation-ownership contract regressions (no hardware)
        run: |
          for suite in input_session neutral_flip_release air_motion_proof action_dispatch native_grab manual_throw control_state; do
            c++ -std=c++20 -O2 -I. "Extension/ArcadeMode/Test/arcade_${suite}_tests.cpp" -o "$RUNNER_TEMP/arcade_${suite}_tests"
            "$RUNNER_TEMP/arcade_${suite}_tests"
          done
      - name: Mac lab, trick-batch cleanup, bootstrap and fake Deck tests (no hardware)
        run: python3 contrib/arcade-mode/lab/controller.py self-test
      - name: Python and shell syntax
        run: |
          python3 -m compileall -q contrib/arcade-mode
          find contrib/arcade-mode -type f \( -name '*.sh' -o -name '*.command' \) -print0 | xargs -0 -n1 bash -n

  deck:
    needs: [build, windows-tests, linux-tests, macos-lab, targeted]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test installer and updater
        run: python3 -m unittest discover -s contrib/arcade-mode -p 'test_*.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReSkate-arcade-dev-${{ github.sha }}
          path: artifacts/runtime
      - name: Verify and package this tested build
        run: |
          python3 contrib/arcade-mode/ci/provenance.py verify artifacts/runtime
          cd artifacts/runtime
          sha256sum -c ReSkate.dll.sha256
          test "$(tr -d '\r\n' < commit.txt)" = "$GITHUB_SHA"
          cd ../..
          python3 contrib/arcade-mode/package_deck_installer.py artifacts/runtime/ReSkate.dll "$GITHUB_SHA" artifacts/Install-ReSkate-Arcade.desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReSkate-Arcade-Deck-${{ github.sha }}
          path: |
            artifacts/Install-ReSkate-Arcade.desktop
            artifacts/channel.json
          if-no-files-found: error


  linux-integration:
    needs: [policy]
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build upstream Linux server
        run: |
          cmake --preset linux-x64
          cmake --build build/linux --target dingosdk_server --parallel 4
      - name: Compile and run portable native Arcade regressions
        run: |
          cmake -S contrib/arcade-mode/ci/targeted -B build/integration-targeted -DCMAKE_BUILD_TYPE=Release
          cmake --build build/integration-targeted --parallel 4
          ctest --test-dir build/integration-targeted --output-on-failure --no-tests=error

  release-eligibility:
    needs: [policy, targeted, build, windows-tests, linux-tests, macos-lab, deck, linux-integration]
    if: always() && needs.policy.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate from this exact run and source
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          gates = json.loads(os.environ['RESULTS'])
          assert all(g['result'] == 'success' for g in gates.values()), gates
          PYCODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ReSkate-arcade-dev-${{ github.sha }}
          path: artifacts/runtime
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          path: source
      - name: Verify the candidate DLL identity
        run: python3 source/contrib/arcade-mode/ci/provenance.py verify artifacts/runtime --full
